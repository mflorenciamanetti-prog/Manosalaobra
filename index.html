document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

color:#2C6E9E;margin-bottom:28px\">\n        Cooperativa de trabajo · Olavarría\n      <\u002Fdiv>\n      <h1 style=\"font-size:56px;line-height:1.08;font-weight:700;letter-spacing:-0.02em;margin:0 0 24px;color:#1B2A4A\">\n        Trabajo organizado y colectivo al servicio de la comunidad\n      <\u002Fh1>\n      <p style=\"font-size:19px;line-height:1.6;color:#3B4A63;margin:0 0 36px;max-width:520px\">\n        Somos Manos a la Obra: sostenemos el Cementerio Parque Loma de Paz y realizamos trabajos de construcción, generando empleo genuino y cuidando lo que es de todos.\n      <\u002Fp>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n        <a href=\"{{ waConstruccion }}\" target=\"_blank\" rel=\"noopener\" style=\"background:#2C6E9E;color:#fff;padding:16px 32px;border-radius:100px;font-size:16px;font-weight:600;box-shadow:0 12px 28px -10px rgba(44,110,158,0.6)\">\n          Pedí tu presupuesto\n        <\u002Fa>\n        <a href=\"#sectores\" style=\"background:#fff;color:#1B2A4A;padding:16px 32px;border-radius:100px;font-size:16px;font-weight:600;border:1px solid #D8E3EC\">\n          Conocé nuestros sectores\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <image-slot id=\"hero-img\" shape=\"rounded\" radius=\"28\" placeholder=\"Foto/video: equipo o predio (hero)\" style=\"width:100%;height:440px;box-shadow:0 30px 60px -30px rgba(27,42,74,0.35)\"><\u002Fimage-slot>\n   <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTORES -->\n  <section id=\"sectores\" style=\"padding:100px 32px;max-width:1240px;margin:0 auto\">\n    <div style=\"text-align:center;max-width:680px;margin:0 auto 64px\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#2C6E9E;margin-bottom:14px\">Sectores<\u002Fdiv>\n      <h2 style=\"font-size:40px;font-weight:700;letter-spacing:-0.01em;margin:0;color:#1B2A4A\">Dos áreas, un mismo compromiso<\u002Fh2>\n    <\u002Fdiv>\n\n    <!-- Construcción — comercial focus -->\n    <div id=\"construccion-block\" style=\"background:#1B2A4A;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-bottom:32px;box-shadow:0 30px 60px -30px rgba(27,42,74,0.5)\">\n      <div style=\"padding:56px 56px 56px 56px;display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"display:inline-flex;width:fit-content;background:#5AA9E6;color:#1B2A4A;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;border-radius:100px;margin-bottom:20px\">Construcción<\u002Fdiv>\n        <h3 style=\"font-size:30px;font-weight:700;color:#fff;margin:0 0 16px;line-height:1.2\">Albañilería general para cada proyecto<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.65;color:#C7D4E6;margin:0 0 24px\">\n          Hacemos trabajos de albañilería en general: pozos de baño, fachadas, paredones, pintura, durlok y soldadura. Ponemos manos a la obra en cada proyecto, grande o chico, con la misma dedicación de siempre.\n        <\u002Fp>\n        <ul style=\"list-style:none;padding:0;margin:0 0 32px;display:flex;flex-direction:column;gap:12px\">\n          <li style=\"display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5AA9E6;flex-shrink:0\"><\u002Fspan>Pozos de baño y fachadas<\u002Fli>\n          <li style=\"display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5AA9E6;flex-shrink:0\"><\u002Fspan>Paredones y pintura<\u002Fli>\n          <li style=\"display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5AA9E6;flex-shrink:0\"><\u002Fspan>Durlok y soldadura<\u002Fli>\n        <\u002Ful>\n        <a href=\"{{ waConstruccion }}\" target=\"_blank\" rel=\"noopener\" style=\"width:fit-content;background:#5AA9E6;color:#1B2A4A;padding:15px 28px;border-radius:100px;font-size:15px;font-weight:700\">Consultá por tu obra →<\u002Fa>\n      <\u002Fdiv>\n      <image-slot id=\"construccion-img\" shape=\"rect\" placeholder=\"Foto/video: obra de construcción\" style=\"width:100%;height:100%;min-height:360px\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div id=\"gal-1\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:80px\">\n      <image-slot id=\"construccion-g1\" shape=\"rounded\" radius=\"18\" placeholder=\"Foto: obra 1\" style=\"width:100%;height:160px\"><\u002Fimage-slot>\n      <image-slot id=\"construccion-g2\" shape=\"rounded\" radius=\"18\" placeholder=\"Foto: obra 2\" style=\"width:100%;height:160px\"><\u002Fimage-slot>\n      <image-slot id=\"construccion-g3\" shape=\"rounded\" radius=\"18\" placeholder=\"Foto: obra 3\" style=\"width:100%;height:160px\"><\u002Fimage-slot>\n    <\u002Fdiv>\n\n    <!-- Cementerio — informational -->\n    <div id=\"cementerio-block\" style=\"background:#fff;border:1px solid #D8E3EC;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)\">\n      <image-slot id=\"cementerio-img\" shape=\"rect\" placeholder=\"Foto/video: Cementerio Parque Loma de Paz\" style=\"width:100%;height:100%;min-height:360px;order:2\"><\u002Fimage-slot>\n      <div id=\"cementerio-text\" style=\"padding:56px;display:flex;flex-direction:column;justify-content:center;order:1\">\n        <div style=\"display:inline-flex;width:fit-content;background:#EAF3FB;color:#2C6E9E;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;border-radius:100px;margin-bottom:20px\">Cementerio Parque Loma de Paz<\u002Fdiv>\n        <h3 style=\"font-size:30px;font-weight:700;color:#1B2A4A;margin:0 0 16px;line-height:1.2\">Cuidado y acompañamiento desde 2024<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.65;color:#3B4A63;margin:0 0 24px\">\n          Desde septiembre de 2024 estamos a cargo del cuidado y mantenimiento del Cementerio Parque Loma de Paz, con el mismo equipo que ya venía trabajando en el predio. Nos ocupamos de la administración y trámites, la atención en sepelios y el cuidado de los espacios verdes, para acompañar a las familias con respeto y cercanía.\n        <\u002Fp>\n        <ul style=\"list-style:none;padding:0;margin:0 0 32px;display:flex;flex-direction:column;gap:12px\">\n          <li style=\"display:flex;align-items:center;gap:12px;color:#1B2A4A;font-size:15px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:50%;background:#2C6E9E;flex-shrink:0\"><\u002Fspan>Administración y trámites<\u002Fli>\n          <li style=\"display:flex;align-items:center;gap:12px;color:#1B2A4A;font-size:15px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:50%;background:#2C6E9E;flex-shrink:0\"><\u002Fspan>Atención en sepelios<\u002Fli>\n          <li style=\"display:flex;align-items:center;gap:12px;color:#1B2A4A;font-size:15px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:50%;background:#2C6E9E;flex-shrink:0\"><\u002Fspan>Mantenimiento de espacios verdes<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <a href=\"https://cementerio-app-nhsw.onrender.com/\" target=\"_blank\" rel=\"noopener\" style=\"background:#2C6E9E;color:#fff;padding:14px 24px;border-radius:100px;font-size:14px;font-weight:600\">Buscar una sepultura<\u002Fa>\n          <a href=\"https://cementerio-app-nhsw.onrender.com/\" target=\"_blank\" rel=\"noopener\" style=\"background:#fff;color:#1B2A4A;padding:14px 24px;border-radius:100px;font-size:14px;font-weight:600;border:1px solid #D8E3EC\">Consultas y reclamos<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"gal-2\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px\">\n      <image-slot id=\"cementerio-g1\" shape=\"rounded\" radius=\"18\" placeholder=\"Foto: predio 1\" style=\"width:100%;height:160px\"><\u002Fimage-slot>\n      <image-slot id=\"cementerio-g2\" shape=\"rounded\" radius=\"18\" placeholder=\"Foto: predio 2\" style=\"width:100%;height:160px\"><\u002Fimage-slot>\n      <image-slot id=\"cementerio-g3\" shape=\"rounded\" radius=\"18\" placeholder=\"Foto: predio 3\" style=\"width:100%;height:160px\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- NOSOTROS -->\n  <section id=\"nosotros\" style=\"background:#1B2A4A;padding:100px 32px;color:#fff\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n      <div style=\"text-align:center;max-width:680px;margin:0 auto 64px\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5AA9E6;margin-bottom:14px\">Nosotros<\u002Fdiv>\n        <h2 style=\"font-size:40px;font-weight:700;letter-spacing:-0.01em;margin:0 0 20px\">Quiénes somos<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.65;color:#C7D4E6;margin:0\">\n          Somos Manos a la Obra, una cooperativa de trabajo de Olavarría. Nos organizamos entre compañeros y compañeras para sostener servicios que la comunidad necesita todos los días. Creemos en el trabajo asociado como forma de generar empleo genuino y de cuidar lo que es de todos.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div id=\"stats-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:72px\">\n        <div style=\"text-align:center;padding:32px 24px;border-radius:20px;background:rgba(255,255,255,0.04)\">\n          <div style=\"font-size:44px;font-weight:700;color:#5AA9E6;margin-bottom:8px\">2022<\u002Fdiv>\n          <div style=\"font-size:15px;color:#C7D4E6\">Nacimos como cooperativa de trabajo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;padding:32px 24px;border-radius:20px;background:rgba(255,255,255,0.04)\">\n          <div style=\"font-size:44px;font-weight:700;color:#5AA9E6;margin-bottom:8px\">22<\u002Fdiv>\n          <div style=\"font-size:15px;color:#C7D4E6\">Asociados y asociadas hoy<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;padding:32px 24px;border-radius:20px;background:rgba(255,255,255,0.04)\">\n          <div style=\"font-size:44px;font-weight:700;color:#5AA9E6;margin-bottom:8px\">2024<\u002Fdiv>\n          <div style=\"font-size:15px;color:#C7D4E6\">Gestión del Cementerio Loma de Paz<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"nosotros-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center\">\n        <image-slot id=\"nosotros-img\" shape=\"rounded\" radius=\"24\" placeholder=\"Foto: equipo de la cooperativa\" style=\"width:100%;height:380px\"><\u002Fimage-slot>\n        <div style=\"position:relative;padding-left:32px;border-left:2px solid rgba(90,169,230,0.35)\">\n          <div style=\"margin-bottom:32px\">\n            <div style=\"font-size:14px;font-weight:700;color:#5AA9E6;margin-bottom:6px\">2022<\u002Fdiv>\n            <p style=\"font-size:16px;line-height:1.6;color:#C7D4E6;margin:0\">Manos a la Obra nació como cooperativa de trabajo en Olavarría.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"margin-bottom:32px\">\n            <div style=\"font-size:14px;font-weight:700;color:#5AA9E6;margin-bottom:6px\">Septiembre 2024<\u002Fdiv>\n            <p style=\"font-size:16px;line-height:1.6;color:#C7D4E6;margin:0\">Asumimos la gestión del Cementerio Parque Loma de Paz, luego de que finalizara el contrato de concesión que durante ocho años estuvo a cargo de Transporte Malvinas.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:700;color:#5AA9E6;margin-bottom:6px\">Hoy<\u002Fdiv>\n            <p style=\"font-size:16px;line-height:1.6;color:#C7D4E6;margin:0\">Seguimos creciendo, sosteniendo puestos de trabajo genuino y sumando nuevas áreas de servicio para la comunidad.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACTO -->\n  <section id=\"contacto\" style=\"background:#EAF3FB;padding:100px 32px\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n      <div style=\"text-align:center;max-width:680px;margin:0 auto 64px\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#2C6E9E;margin-bottom:14px\">Contacto<\u002Fdiv>\n        <h2 style=\"font-size:40px;font-weight:700;letter-spacing:-0.01em;margin:0;color:#1B2A4A\">Hablemos de tu proyecto<\u002Fh2>\n      <\u002Fdiv>\n\n      <div id=\"sedes-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:24px\">\n        <div style=\"background:#fff;border-radius:24px;padding:40px;box-shadow:0 20px 40px -28px rgba(27,42,74,0.25)\">\n          <h3 style=\"font-size:20px;font-weight:700;color:#1B2A4A;margin:0 0 20px\">Cementerio Parque Loma de Paz<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:14px;font-size:15px;color:#3B4A63;line-height:1.5\">\n            <div><strong style=\"color:#1B2A4A\">Dirección:<\u002Fstrong> KM 302, RN 226 — B7400 Olavarría, Buenos Aires<\u002Fdiv>\n            <div><strong style=\"color:#1B2A4A\">Tel:<\u002Fstrong> +54 2284 387438<\u002Fdiv>\n            <div><strong style=\"color:#1B2A4A\">Email:<\u002Fstrong> manosalaobra.cooperativa.1@gmail.com<\u002Fdiv>\n            <div><strong style=\"color:#1B2A4A\">Horario:<\u002Fstrong> Lun a Dom y feriados, 8 a 19 hs<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"{{ waCementerio }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px;background:#2E9E6B;color:#fff;padding:14px;border-radius:100px;font-size:15px;font-weight:600\">WhatsApp Cementerio<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:24px;padding:40px;box-shadow:0 20px 40px -28px rgba(27,42,74,0.25)\">\n          <h3 style=\"font-size:20px;font-weight:700;color:#1B2A4A;margin:0 0 20px\">Oficina administrativa<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:14px;font-size:15px;color:#3B4A63;line-height:1.5\">\n            <div><strong style=\"color:#1B2A4A\">Dirección:<\u002Fstrong> Moreno 2775, Olavarría<\u002Fdiv>\n            <div><strong style=\"color:#1B2A4A\">Tel:<\u002Fstrong> +54 2284 477144<\u002Fdiv>\n            <div><strong style=\"color:#1B2A4A\">Email:<\u002Fstrong> cementeriolomadepaz@gmail.com<\u002Fdiv>\n            <div><strong style=\"color:#1B2A4A\">Horario:<\u002Fstrong> Lun a Vie, 8 a 15 hs<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"{{ waConstruccion }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px;background:#2C6E9E;color:#fff;padding:14px;border-radius:100px;font-size:15px;font-weight:600\">Consultá por tu obra<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border-radius:24px;padding:48px;box-shadow:0 20px 40px -28px rgba(27,42,74,0.25)\">\n        <h3 style=\"font-size:20px;font-weight:700;color:#1B2A4A;margin:0 0 28px\">Escribinos<\u002Fh3>\n        <sc-if value=\"{{ formSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#EAF3FB;border-radius:16px;padding:24px 28px\">\n            <span style=\"width:36px;height:36px;border-radius:50%;background:#2E9E6B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0\">✓<\u002Fspan>\n            <div>\n              <div style=\"font-weight:700;color:#1B2A4A;font-size:16px\">¡Gracias por escribirnos!<\u002Fdiv>\n              <div style=\"color:#3B4A63;font-size:14px;margin-top:2px\">Te vamos a responder a la brevedad.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ formNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form id=\"form-grid\" sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px\">\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:8px\">Nombre<\u002Flabel>\n              <input required=\"{{ true }}\" type=\"text\" value=\"{{ formData.nombre }}\" sc-camel-on-change=\"{{ updateField('nombre') }}\" style=\"width:100%;padding:13px 16px;border-radius:12px;border:1px solid #D8E3EC;font-size:15px;color:#1B2A4A;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:8px\">Teléfono<\u002Flabel>\n              <input type=\"tel\" value=\"{{ formData.telefono }}\" sc-camel-on-change=\"{{ updateField('telefono') }}\" style=\"width:100%;padding:13px 16px;border-radius:12px;border:1px solid #D8E3EC;font-size:15px;color:#1B2A4A;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:8px\">Email<\u002Flabel>\n              <input required=\"{{ true }}\" type=\"email\" value=\"{{ formData.email }}\" sc-camel-on-change=\"{{ updateField('email') }}\" style=\"width:100%;padding:13px 16px;border-radius:12px;border:1px solid #D8E3EC;font-size:15px;color:#1B2A4A;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:8px\">Sector de interés<\u002Flabel>\n              <sc-raw-select value=\"{{ formData.sector }}\" sc-camel-on-change=\"{{ updateField('sector') }}\" style=\"width:100%;padding:13px 16px;border-radius:12px;border:1px solid #D8E3EC;font-size:15px;color:#1B2A4A;background:#fff\">\n                <option value=\"\">Elegí una opción<\u002Foption>\n                <option value=\"construccion\">Construcción<\u002Foption>\n                <option value=\"cementerio\">Cementerio<\u002Foption>\n                <option value=\"otro\">Otro<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isOtro }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"grid-column:1/-1\">\n                <label style=\"display:block;font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:8px\">Especificá<\u002Flabel>\n                <input type=\"text\" value=\"{{ formData.otro }}\" sc-camel-on-change=\"{{ updateField('otro') }}\" style=\"width:100%;padding:13px 16px;border-radius:12px;border:1px solid #D8E3EC;font-size:15px;color:#1B2A4A;background:#fff\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"grid-column:1/-1\">\n              <label style=\"display:block;font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:8px\">Mensaje<\u002Flabel>\n              <textarea required=\"{{ true }}\" rows=\"4\" value=\"{{ formData.mensaje }}\" sc-camel-on-change=\"{{ updateField('mensaje') }}\" style=\"width:100%;padding:13px 16px;border-radius:12px;border:1px solid #D8E3EC;font-size:15px;color:#1B2A4A;background:#fff;resize:vertical;font-family:inherit\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"grid-column:1/-1\">\n              <button type=\"submit\" style=\"background:#2C6E9E;color:#fff;padding:15px 36px;border-radius:100px;font-size:15px;font-weight:600;border:none;cursor:pointer\">Enviar mensaje<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#1B2A4A;padding:48px 32px;border-top:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <img src=\"d0000cff-6d69-443b-b945-30f97c895338\" alt=\"Manos a la Obra\" style=\"height:36px;width:auto;object-fit:contain;filter:brightness(0) invert(1);opacity:0.9\">\n        <span style=\"color:#C7D4E6;font-size:14px\">Cooperativa de Trabajo · Olavarría<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"color:#8FA3C4;font-size:13px\">© 2026 Manos a la Obra. Todos los derechos reservados.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    menuOpen: false,\n    formData: { nombre: '', telefono: '', email: '', sector: '', otro: '', mensaje: '' },\n    formSent: false\n  };\n\n  toggleMenu = () => this.setState(s => ({ menuOpen: !s.menuOpen }));\n  closeMenu = () => this.setState({ menuOpen: false });\n\n  updateField = (field) => (e) => {\n    const value = e && e.target ? e.target.value : '';\n    this.setState(s => ({ formData: { ...s.formData, [field]: value } }));\n  };\n\n  handleSubmit = (e) => {\n    e.preventDefault();\n    this.setState({ formSent: true });\n  };\n\n  renderVals() {\n    const waConstruccion = \"https://wa.me/542284387438?text=\" + encodeURIComponent(\"Hola, quiero consultar por un trabajo de construcción.\");\n    const waCementerio = \"https://wa.me/542284387438?text=\" + encodeURIComponent(\"Hola, quiero hacer una consulta sobre el Cementerio Parque Loma de Paz.\");\n    return {\n      menuOpen: this.state.menuOpen,\n      toggleMenu: this.toggleMenu,\n      closeMenu: this.closeMenu,\n      waConstruccion,\n      waCementerio,\n      formData: this.state.formData,\n      updateField: this.updateField,\n      handleSubmit: this.handleSubmit,\n      formSent: this.state.formSent,\n      formNotSent: !this.state.formSent,\n      isOtro: this.state.formData.sector === 'otro'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
